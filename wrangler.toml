name = "tesma"
main = "worker.ts"
compatibility_date = "2024-01-01"

# Automatically build Vite frontend (creates dist/) before deploying
[build]
command = "npm run build"

# Assets / Static files configuration (modern Cloudflare Workers / Pages Assets)
[assets]
directory = "./dist"
binding = "ASSETS"

# Cloudflare D1 SQL Database Binding
[[d1_databases]]
binding = "DB"
database_name = "tesma-db"
database_id = "9e692809-14a5-4076-b4dd-79e1fe03bc7f"
